<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Crystallization half-time of PPeAT</title><desc id="desc">Ionomer nucleation reduces crystallization half-time from 28 minutes to approximately 0.5 to 0.6 minutes at 40 degrees Celsius.</desc>
  <rect width="1000" height="520" rx="28" fill="#071a31"/><text x="64" y="70" fill="#66d6ef" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">RESEARCH SNAPSHOT</text><text x="64" y="116" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Crystallization shifts from minutes to seconds</text>
  <line x1="112" y1="395" x2="900" y2="395" stroke="#58708c"/><g fill="#8ea5bf" font-family="Arial" font-size="14"><text x="108" y="425">0</text><text x="355" y="425">10</text><text x="613" y="425">20</text><text x="870" y="425">30 min</text></g>
  <g font-family="Arial"><text x="64" y="187" fill="#b8c9dc" font-size="18">Neat PPeAT</text><rect x="230" y="162" width="650" height="42" rx="7" fill="#37506d"/><text x="894" y="190" fill="#fff" font-size="17">28 min</text><text x="64" y="278" fill="#b8c9dc" font-size="18">Optimized ionomer</text><rect x="230" y="253" width="14" height="42" rx="7" fill="#4dcce8"/><text x="262" y="281" fill="#fff" font-size="17">0.5–0.6 min</text></g>
  <rect x="230" y="327" width="292" height="44" rx="22" fill="#164da8"/><text x="376" y="356" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="700">Up to 56× faster</text><text x="936" y="487" text-anchor="end" fill="#7590ad" font-family="Arial" font-size="13">40°C isothermal crystallization · Aboukeila et al., 2026</text>
</svg>
