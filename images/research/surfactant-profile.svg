<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Performance profile of surfactants derived from waste HDPE</title><desc id="desc">The plastic-derived carboxylate mixture has more than 95 percent purity, critical micelle concentration as low as 0.08 weight percent, and calcium tolerance of 221 parts per million.</desc>
  <rect width="1000" height="520" rx="28" fill="#071a31"/><text x="64" y="70" fill="#66d6ef" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">RESEARCH SNAPSHOT</text><text x="64" y="116" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Waste plastic becomes a functional surfactant</text>
  <g font-family="Arial" text-anchor="middle"><rect x="70" y="178" width="190" height="196" rx="18" fill="#102f58" stroke="#33577f"/><text x="165" y="222" fill="#9bb1ca" font-size="15">FEEDSTOCK</text><text x="165" y="277" fill="#66d6ef" font-size="36" font-weight="700">PCR-HDPE</text><text x="165" y="315" fill="#fff" font-size="17">post-consumer plastic</text><path d="M285 276h95" stroke="#66d6ef" stroke-width="4"/><path d="m366 263 20 13-20 13" fill="none" stroke="#66d6ef" stroke-width="4"/><rect x="405" y="178" width="190" height="196" rx="18" fill="#102f58" stroke="#33577f"/><text x="500" y="222" fill="#9bb1ca" font-size="15">PRODUCT</text><text x="500" y="277" fill="#66d6ef" font-size="36" font-weight="700">&gt;95%</text><text x="500" y="315" fill="#fff" font-size="17">carboxylate purity</text><path d="M620 276h95" stroke="#66d6ef" stroke-width="4"/><path d="m701 263 20 13-20 13" fill="none" stroke="#66d6ef" stroke-width="4"/><rect x="740" y="178" width="190" height="196" rx="18" fill="#164da8" stroke="#66d6ef"/><text x="835" y="222" fill="#d9f8ff" font-size="15">PERFORMANCE</text><text x="835" y="267" fill="#fff" font-size="30" font-weight="700">0.08 wt%</text><text x="835" y="296" fill="#d9f8ff" font-size="15">lowest CMC</text><text x="835" y="338" fill="#fff" font-size="25" font-weight="700">221 ppm Ca²⁺</text></g>
  <text x="936" y="487" text-anchor="end" fill="#7590ad" font-family="Arial" font-size="13">Performance values from Li et al., Angew. Chem. Int. Ed., 2025</text>
</svg>
