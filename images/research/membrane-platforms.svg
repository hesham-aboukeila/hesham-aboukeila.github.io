<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Three membrane platforms and their principal transport gains</title><desc id="desc">Nafion PEGDME achieved 36 times higher dry carbon dioxide permeability, water-conditioned TESET reached 482 Barrer, and humid Aquivion produced more than ten times higher permeability.</desc>
  <rect width="1000" height="520" rx="28" fill="#071a31"/><text x="64" y="70" fill="#66d6ef" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">RESEARCH SNAPSHOT</text><text x="64" y="116" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Three routes to faster CO₂ transport</text>
  <g font-family="Arial" text-anchor="middle"><rect x="64" y="165" width="272" height="245" rx="20" fill="#102f58" stroke="#33577f"/><text x="200" y="210" fill="#9bb1ca" font-size="15">FORMULATION</text><text x="200" y="247" fill="#fff" font-size="22" font-weight="700">Nafion + PEGDME</text><text x="200" y="315" fill="#66d6ef" font-size="44" font-weight="700">36×</text><text x="200" y="347" fill="#d9e5f2" font-size="15">higher dry CO₂ permeability</text><rect x="364" y="165" width="272" height="245" rx="20" fill="#102f58" stroke="#33577f"/><text x="500" y="210" fill="#9bb1ca" font-size="15">CONDITIONING</text><text x="500" y="247" fill="#fff" font-size="22" font-weight="700">Water-treated TESET</text><text x="500" y="315" fill="#66d6ef" font-size="44" font-weight="700">482</text><text x="500" y="347" fill="#d9e5f2" font-size="15">Barrer CO₂ permeability</text><rect x="664" y="165" width="272" height="245" rx="20" fill="#164da8" stroke="#66d6ef"/><text x="800" y="210" fill="#d9f8ff" font-size="15">OPERATING ENVIRONMENT</text><text x="800" y="247" fill="#fff" font-size="22" font-weight="700">Humid Aquivion</text><text x="800" y="315" fill="#fff" font-size="44" font-weight="700">&gt;10×</text><text x="800" y="347" fill="#d9f8ff" font-size="15">permeability increase</text></g>
  <text x="936" y="487" text-anchor="end" fill="#7590ad" font-family="Arial" font-size="13">Synthesis of three peer-reviewed membrane studies, 2017–2019</text>
</svg>
