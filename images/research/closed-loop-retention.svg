<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Closed-loop recycling performance retention</title><desc id="desc">Repolymerized PPeAT retains 97 percent of virgin Young's modulus and comparable molecular and thermal characteristics.</desc>
  <rect width="1000" height="520" rx="28" fill="#071a31"/><text x="64" y="70" fill="#66d6ef" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">RESEARCH SNAPSHOT</text><text x="64" y="116" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Depolymerize, purify, and rebuild</text>
  <g font-family="Arial" text-anchor="middle"><circle cx="165" cy="252" r="76" fill="#123a72" stroke="#66d6ef" stroke-width="3"/><text x="165" y="245" fill="#fff" font-size="21" font-weight="700">PPeAT</text><text x="165" y="273" fill="#9bb1ca" font-size="15">used polymer</text><path d="M252 252h110" stroke="#66d6ef" stroke-width="4"/><path d="m350 239 20 13-20 13" fill="none" stroke="#66d6ef" stroke-width="4"/><circle cx="500" cy="252" r="76" fill="#123a72" stroke="#66d6ef" stroke-width="3"/><text x="500" y="245" fill="#fff" font-size="20" font-weight="700">Methanolysis</text><text x="500" y="273" fill="#9bb1ca" font-size="15">amine catalysis</text><path d="M587 252h110" stroke="#66d6ef" stroke-width="4"/><path d="m685 239 20 13-20 13" fill="none" stroke="#66d6ef" stroke-width="4"/><circle cx="835" cy="252" r="76" fill="#164da8" stroke="#66d6ef" stroke-width="3"/><text x="835" y="241" fill="#fff" font-size="20" font-weight="700">Repolymerized</text><text x="835" y="271" fill="#fff" font-size="28" font-weight="700">184 kg/mol</text></g>
  <rect x="314" y="373" width="372" height="54" rx="27" fill="#0d2b50" stroke="#33577f"/><text x="500" y="407" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19"><tspan fill="#66d6ef" font-weight="700">97%</tspan> of virgin Young's modulus retained</text><text x="936" y="487" text-anchor="end" fill="#7590ad" font-family="Arial" font-size="13">Reported in Aboukeila et al., ChemSusChem, 2026</text>
</svg>
