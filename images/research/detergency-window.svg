<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Detergency formulation window comparison</title><desc id="desc">Potassium carbonate provides an accessible HLD span of approximately 8 units versus approximately 4.5 with sodium chloride, with maximum soil removal up to 90 percent.</desc>
  <rect width="1000" height="520" rx="28" fill="#071a31"/><text x="64" y="70" fill="#66d6ef" font-family="Arial" font-size="18" font-weight="700" letter-spacing="3">RESEARCH SNAPSHOT</text><text x="64" y="116" fill="#fff" font-family="Arial" font-size="30" font-weight="700">A broader chloride-free formulation window</text>
  <g font-family="Arial"><text x="64" y="205" fill="#b8c9dc" font-size="18">NaCl system</text><line x1="260" y1="198" x2="865" y2="198" stroke="#2e4663" stroke-width="8" stroke-linecap="round"/><line x1="420" y1="198" x2="640" y2="198" stroke="#7d91a9" stroke-width="24" stroke-linecap="round"/><text x="660" y="205" fill="#fff" font-size="17">≈4.5 HLD units</text><text x="64" y="314" fill="#b8c9dc" font-size="18">K₂CO₃ system</text><line x1="260" y1="307" x2="865" y2="307" stroke="#2e4663" stroke-width="8" stroke-linecap="round"/><line x1="300" y1="307" x2="700" y2="307" stroke="#4dcce8" stroke-width="24" stroke-linecap="round"/><text x="720" y="314" fill="#fff" font-size="17">≈8 HLD units</text></g>
  <rect x="300" y="378" width="300" height="52" rx="26" fill="#164da8"/><text x="450" y="411" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="700">Up to 90% soil removal</text><text x="936" y="487" text-anchor="end" fill="#7590ad" font-family="Arial" font-size="13">Three nonionic alcohol ethoxylates · Aboukeila et al., 2026</text>
</svg>
